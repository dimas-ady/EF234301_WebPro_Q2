services:
  db:
    image: docker.io/library/mysql:8.4
    environment:
      MYSQL_DATABASE: vaultify
      MYSQL_USER: vaultify
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: root-secret
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot-secret"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    image: ${VAULTIFY_IMAGE:?set VAULTIFY_IMAGE in .env}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_DATABASE: vaultify
      DB_USERNAME: vaultify
      DB_PASSWORD: secret
      VAULTIFY_APP_KEY: ${VAULTIFY_APP_KEY:?set VAULTIFY_APP_KEY in .env}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  db-data:
